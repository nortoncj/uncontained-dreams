<style>
body{margin:0;background:#F1F3F2;color:#1B2429;font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:#14324A}a:hover{color:#B04E25}

p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(20px,4vw);padding-right:max(20px,4vw);box-sizing:border-box}
.media{position:relative;box-sizing:border-box;border:1.5px dashed #8FA0A6;background:#DCE3E5;color:#14324A;border-radius:2px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding:16px;overflow:hidden}

.btn.primary:hover{background:#963F1C;color:#FFFFFF}
.btn.ghost{border:1.5px solid currentColor;color:#14324A}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#5A666C}

.media.filled{border:0;padding:0;background:#1E425E}
.media>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.page-h1{font-size:clamp(40px,6vw,60px);line-height:1;font-weight:800;letter-spacing:-.015em}
